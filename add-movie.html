<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchTrove - Tambah Tontonan Baru</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary bg-opacity-25 border-bottom border-primary mb-4">
        <div class="container">
            <a class="navbar-brand text-info fw-bold" href="index.html">🎬 WatchTrove</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item">
                        <a class="btn btn-outline-info btn-sm px-3" href="index.html">Daftar Tontonan</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-primary btn-sm px-3" href="add-movie.html">+ Tambah Judul Baru</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        <article class="card bg-surface p-4 border-secondary mb-4">
            <h2 class="h3 text-info fw-bold border-start border-4 border-info ps-2 mb-3">Tambah Judul ke Watchlist</h2>
            <p class="text-secondary small mb-4">Isi formulir di bawah ini untuk menambahkan entri tontonan baru:</p>

            <form action="index.html" method="get">
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label for="title" class="form-label text-light fw-semibold">Judul Film / Series:</label>
                        <input type="text" id="title" name="title" class="form-control bg-input text-light border-secondary" required placeholder="Contoh: Interstellar">
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="type" class="form-label text-light fw-semibold">Tipe Tontonan:</label>
                        <select id="type" name="type" class="form-select bg-input text-light border-secondary" required>
                            <option value="">-- Pilih Tipe --</option>
                            <option value="movie">Film Layar Lebar</option>
                            <option value="series">Series</option>
                            <option value="anime">Anime</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="genre" class="form-label text-light fw-semibold">Genre:</label>
                        <input type="text" id="genre" name="genre" class="form-control bg-input text-light border-secondary" placeholder="Contoh: Sci-Fi, Adventure">
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="release_year" class="form-label text-light fw-semibold">Tahun Rilis:</label>
                        <input type="number" id="release_year" name="release_year" class="form-control bg-input text-light border-secondary" min="1900" max="2099" placeholder="2014">
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="status" class="form-label text-light fw-semibold">Status Tontonan:</label>
                        <select id="status" name="status" class="form-select bg-input text-light border-secondary" required>
                            <option value="plan_to_watch">Ingin Ditonton</option>
                            <option value="watching">Sedang Ditonton</option>
                            <option value="completed">Selesai Ditonton</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="rating" class="form-label text-light fw-semibold">Rating Personal (0 - 10):</label>
                        <input type="number" id="rating" name="rating" class="form-control bg-input text-light border-secondary" min="0" max="10" step="0.1" placeholder="Contoh: 9.5">
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="poster_path" class="form-label text-light fw-semibold">Lokasi / Nama File Poster:</label>
                        <input type="text" id="poster_path" name="poster_path" class="form-control bg-input text-light border-secondary" placeholder="assets/images/poster-interstellar.jpg">
                    </div>

                    <div class="col-12">
                        <label for="synopsis" class="form-label text-light fw-semibold">Sinopsis / Ulasan Singkat:</label>
                        <textarea id="synopsis" name="synopsis" rows="4" class="form-control bg-input text-light border-secondary" placeholder="Tulis ringkasan cerita atau ulasan film/series..."></textarea>
                    </div>

                    <div class="col-12 mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">Simpan ke Watchlist</button>
                        <button type="reset" class="btn btn-secondary px-3">Reset Formulir</button>
                    </div>
                </div>
            </form>
        </article>
    </main>

    <footer class="text-center py-4 text-secondary small border-top border-secondary mt-4">
        <p class="mb-0">WatchTrove - Dibuat oleh Ravie Arya Desta Wijayana (103022400147)</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
