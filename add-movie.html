<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchTrove - Tambah Tontonan Baru</title>
</head>
<body>

    <header>
        <h1>WatchTrove</h1>
        <p>Koleksi dan Jurnal Tontonan Film & Series Personal</p>
        <nav>
            <ul>
                <li><a href="index.html">Daftar Tontonan</a></li>
                <li><a href="add-movie.html">Tambah Judul Baru</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article>
            <h2>Tambah Judul ke Watchlist</h2>
            <p>Isi formulir di bawah ini untuk menambahkan entri tontonan baru:</p>

            <form action="index.html" method="get">
                <div>
                    <label for="title">Judul Film / Series:</label><br>
                    <input type="text" id="title" name="title" required placeholder="Contoh: Interstellar">
                </div>
                <br>

                <div>
                    <label for="type">Tipe Tontonan:</label><br>
                    <select id="type" name="type" required>
                        <option value="">-- Pilih Tipe --</option>
                        <option value="movie">Film Layar Lebar</option>
                        <option value="series">Series</option>
                        <option value="anime">Anime</option>
                    </select>
                </div>
                <br>

                <div>
                    <label for="genre">Genre:</label><br>
                    <input type="text" id="genre" name="genre" placeholder="Contoh: Sci-Fi, Adventure">
                </div>
                <br>

                <div>
                    <label for="release_year">Tahun Rilis:</label><br>
                    <input type="number" id="release_year" name="release_year" min="1900" max="2099" placeholder="2014">
                </div>
                <br>

                <div>
                    <label for="status">Status Tontonan:</label><br>
                    <select id="status" name="status" required>
                        <option value="plan_to_watch">Ingin Ditonton</option>
                        <option value="watching">Sedang Ditonton</option>
                        <option value="completed">Selesai Ditonton</option>
                    </select>
                </div>
                <br>

                <div>
                    <label for="rating">Rating Personal (0 - 10):</label><br>
                    <input type="number" id="rating" name="rating" min="0" max="10" step="0.1" placeholder="Contoh: 9.5">
                </div>
                <br>

                <div>
                    <label for="poster_path">Lokasi / Nama File Poster:</label><br>
                    <input type="text" id="poster_path" name="poster_path" placeholder="assets/images/poster-interstellar.jpg">
                </div>
                <br>

                <div>
                    <label for="synopsis">Sinopsis / Ulasan Singkat:</label><br>
                    <textarea id="synopsis" name="synopsis" rows="5" cols="40" placeholder="Tulis ringkasan cerita atau ulasan film/series..."></textarea>
                </div>
                <br>

                <button type="submit">Simpan ke Watchlist</button>
                <button type="reset">Reset Formulir</button>
            </form>
        </article>
    </main>

    <footer>
        <p>WatchTrove - Dibuat oleh Ravie Arya Desta Wijayana (103022400147)</p>
    </footer>

</body>
</html>
